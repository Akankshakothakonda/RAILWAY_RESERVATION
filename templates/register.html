{% extends "base.html" %}

{% block title %}
Passenger Registration
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card single-auth">

        <div class="auth-form">

            <span class="eyebrow">
                NEW PASSENGER
            </span>

            <h1>
                Create your account
            </h1>

            <p class="muted">
                Register to use railway reservation services.
            </p>


            <form method="POST" class="form-grid">

                <div class="full">

                    <label>
                        Full name
                    </label>

                    <input
                        name="name"
                        required
                        placeholder="Enter full name"
                    >

                </div>


                <div>

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                        placeholder="you@example.com"
                    >

                </div>


                <div>

                    <label>
                        Phone
                    </label>

                    <input
                        name="phone"
                        placeholder="10-digit number"
                    >

                </div>


                <div>

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        placeholder="Create password"
                    >

                </div>


                <div>

                    <label>
                        Confirm password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                        placeholder="Repeat password"
                    >

                </div>


                <div class="full">

                    <button
                        class="btn btn-primary btn-block"
                        type="submit"
                    >
                        Create Passenger Account
                    </button>

                </div>

            </form>


            <p class="form-footer">

                Already registered?

                <a href="{{ url_for('login') }}">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
